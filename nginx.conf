# =============================================================
# 考研 AI 平台 - Nginx 反向代理(生产 HTTPS)
# 域名: www.sx01bit.cn
# 证书: Let's Encrypt(webroot 模式)
# =============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 20m;
    client_body_buffer_size 128k;
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml;

    # 上游
    upstream kaoyan_app {
        server app:8000;
        keepalive 32;
    }

    # 限流(http 段定义,server 段引用)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    # HTTP 80 - 重定向到 HTTPS,保留 ACME challenge
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name www.sx01bit.cn sx01bit.cn;

        # ACME challenge(Let's Encrypt 续期)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # 其他全部 301 → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 443 - 主站点
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.sx01bit.cn sx01bit.cn;

        # SSL 证书(Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/www.sx01bit.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.sx01bit.cn/privkey.pem;

        # SSL 配置(Mozilla Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

        # 主应用页面必须经过 /app 的服务端鉴权，禁止绕过访问静态 HTML。
        location = /static/index.html {
            return 302 /app;
        }

        # 静态资源(代理给 app)
        location /static/ {
            proxy_pass http://kaoyan_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            access_log off;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://kaoyan_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # 知识图谱端点
        location /kg/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://kaoyan_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI SSE: immediately forward each model chunk.
        location = /chat/stream {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://kaoyan_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            add_header X-Accel-Buffering no;
        }

        # 错题本/题库/聊天等其他 API
        location / {
            proxy_pass http://kaoyan_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查
        location /health {
            access_log off;
            proxy_pass http://kaoyan_app/health;
        }
    }
}
